<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Cronos - Sistema de Gestión para Repostería Especializada</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="./assets/media/logos/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
  <link rel="stylesheet" id="layout-styles-anchor" href="./assets/splash-screen.css" />
</head>

<body root>
  <script>
    // Apply the persisted (or system-preferred) theme before Angular boots to avoid a flash
    (function () {
      var mode = localStorage.getItem('cronos_theme_mode');
      if (!mode) {
        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.toggle('app-dark', mode === 'dark');
    })();
  </script>
  <div id="splash-screen" class="splash-screen">
    <img src="./assets/media/logos/favicon.svg" alt="Cronos logo" />
    <span>Cargando ...</span>
  </div>
</body>

</html>
