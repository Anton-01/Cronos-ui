<!--begin::Logo image-->
<a routerLink="/dashboard">
  @if (currentLayoutType === 'dark-sidebar') {
    <img alt="Cronos" src="./assets/media/logos/custom-1.svg" class="h-25px app-sidebar-logo-default" />
  }
  @if (currentLayoutType !== 'dark-sidebar') {
    <img alt="Cronos" src="./assets/media/logos/cronos-logo-light.svg" class="h-25px app-sidebar-logo-default theme-light-show" />
    <img alt="Cronos" src="./assets/media/logos/custom-1.svg"
      class="h-25px app-sidebar-logo-default theme-dark-show" />
  }

  <img alt="Cronos" src="./assets/media/logos/cronos-small.svg" class="h-20px app-sidebar-logo-minimize" />
</a>
<!--end::Logo image-->


@if (toggleEnabled) {
  <!--begin::Sidebar toggle-->
  <div id="kt_app_sidebar_toggle"
    class="app-sidebar-toggle btn btn-icon btn-shadow btn-sm btn-color-muted btn-active-color-primary body-bg h-30px w-30px position-absolute top-50 start-100 translate-middle rotate"
    [ngClass]="toggleButtonClass" data-kt-toggle="true" [attr.data-kt-toggle-state]="toggleState"
    data-kt-toggle-target="body" [attr.data-kt-toggle-name]="toggleAttr">
    <app-keenicon name="double-left" class="fs-2 rotate-180"></app-keenicon>
  </div>
  <!--end::Sidebar toggle-->
}
