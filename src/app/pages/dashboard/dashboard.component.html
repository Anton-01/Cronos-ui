<div class="mb-4">
  <h2 class="dashboard-greeting m-0">{{ greeting() }}</h2>
  <p class="mt-1 mb-0 text-color-secondary">{{ subtitle() }}</p>
</div>

<!-- Metric row — the four accents of Context.md §12.2, in fixed order. -->
<div class="grid">
  @for (metric of metrics(); track metric.key) {
    <div class="col-12 md:col-6 xl:col-3">
      <app-stat-card
        [label]="metric.label"
        [value]="countOf(metric.key)"
        [caption]="metric.caption"
        [icon]="metric.icon"
        [accent]="metric.accent"
        [link]="metric.route"
        [loading]="isLoading()"
      />
    </div>
  }
</div>
