@switch (loadState()) {
  @case ('loading') {
    <div class="grid">
      @for (item of [1, 2, 3, 4]; track item) {
        <div class="col-12 xl:col-6"><p-skeleton height="16rem" borderRadius="14px" /></div>
      }
    </div>
  }
  @case ('error') {
    <p-card>
      <div class="flex flex-column align-items-center gap-3 py-6">
        <p-message severity="error" [text]="'GUIDE.LOAD_FAILED' | translate" />
        <p-button [label]="'COMMON.TRY_AGAIN' | translate" icon="pi pi-refresh" (onClick)="load()" />
      </div>
    </p-card>
  }
  @case ('ready') {
    @if (offline()) {
      <p-message severity="info" styleClass="w-full mb-3" icon="pi pi-cloud" [text]="'GUIDE.OFFLINE' | translate" />
    }
    <p-tabs [value]="activeTab()" (valueChange)="selectTab($event)" [scrollable]="true" [dt]="{ tablist: { background: 'transparent' }, tabpanel: { background: 'transparent', padding: '1.25rem 0 0 0' } }">
      <p-tablist>
        @for (tab of tabs; track tab.value) {
          <p-tab [value]="tab.value" class="flex align-items-center gap-2">
            <i [class]="tab.icon" aria-hidden="true"></i>
            <span>{{ tab.labelKey | translate }}</span>
          </p-tab>
        }
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="calculators">
          <app-guide-calculators [pans]="guide()?.panSizes ?? []" [conversions]="guide()?.conversions ?? []" />
        </p-tabpanel>
        <p-tabpanel value="pans">
          <app-guide-pans [pans]="guide()?.panSizes ?? []" [offline]="offline()" (changed)="load(true)" />
        </p-tabpanel>
        @for (tab of tabs; track tab.value) {
          @if (tab.category) {
            <p-tabpanel [value]="tab.value">
              <app-guide-articles [articles]="articlesBy().get(tab.category) ?? []" />
            </p-tabpanel>
          }
        }
      </p-tabpanels>
    </p-tabs>
  }
}
