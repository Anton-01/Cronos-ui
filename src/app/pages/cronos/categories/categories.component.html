<p-card>
  <p-table
    #table
    [value]="items()"
    dataKey="id"
    paginatorPosition="bottom"
    [stripedRows]="true"
    [loading]="isLoading()"
    [showLoader]="false"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['name', 'description']"
    sortField="name"
    [sortOrder]="1"
    [rowHover]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between flex-wrap gap-2">
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Buscar categoría..."
            (input)="table.filterGlobal($any($event.target).value, 'contains')"
          />
        </p-iconfield>
        <div class="flex align-items-center gap-3">
          <p-button label="Nueva Categoría" icon="pi pi-plus" severity="contrast" styleClass="p-button-page-action" (onClick)="openCreate()" />
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" style="min-width: 12rem">
          Nombre
          <p-sortIcon field="name" />
          <p-columnFilter type="text" field="name" display="menu" placeholder="Filtrar por nombre" />
        </th>
        <th pSortableColumn="description" style="min-width: 16rem">
          Descripción
          <p-sortIcon field="description" />
          <p-columnFilter type="text" field="description" display="menu" placeholder="Filtrar por descripción" />
        </th>
        <th style="width: 10rem">
          Estado
          <p-columnFilter field="status" matchMode="equals" display="menu" [showMatchModes]="false" [showOperator]="false" [showAddButton]="false">
            <ng-template pTemplate="filter" let-value let-filter="filterCallback">
              <p-select
                [ngModel]="value"
                [options]="statusFilterOptions"
                optionLabel="label"
                optionValue="value"
                placeholder="Todos"
                [showClear]="true"
                (onChange)="filter($event.value)"
              />
            </ng-template>
          </p-columnFilter>
        </th>
        <th style="width: 8rem" class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
      <tr>
        <td class="font-semibold">{{ item.name }}</td>
        <td>{{ item.description || '-' }}</td>
        <td>
          <app-status-toggle
            [item]="item"
            endpoint="category"
            [nameEntity]="item.name"
            (statusChanged)="updateItemStatus(item.id, $event)"
          />
        </td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="Editar"
            (onClick)="openEdit(item)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="Eliminar"
            (onClick)="confirmDelete(item)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="loadingbody">
      @for (row of skeletonRows; track $index) {
        <tr appTableSkeletonRow [columns]="4"></tr>
      }
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center text-color-secondary py-5">No hay categorías registradas</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [header]="selectedItem() ? 'Editar Categoría' : 'Nueva Categoría'"
  [visible]="showForm()"
  (visibleChange)="!$event && closeForm()"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '30rem' }"
>
  <form [formGroup]="form" (ngSubmit)="saveForm()" id="categoryForm" class="flex flex-column gap-3">
    <div class="flex flex-column gap-1">
      <label for="categoryName" class="font-medium">Nombre <span class="text-red-500">*</span></label>
      <input
        pInputText
        id="categoryName"
        formControlName="name"
        placeholder="Nombre de la categoría"
        [class.ng-dirty]="form.controls.name.touched"
      />
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <small class="text-red-500">El nombre es requerido</small>
      }
    </div>
    <div class="flex flex-column gap-1">
      <label for="categoryDescription" class="font-medium">Descripción</label>
      <textarea
        pTextarea
        id="categoryDescription"
        formControlName="description"
        rows="3"
        placeholder="Descripción opcional"
      ></textarea>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="closeForm()" />
    <p-button
      [label]="selectedItem() ? 'Actualizar' : 'Crear'"
      type="submit"
      form="categoryForm"
      [disabled]="form.invalid"
      [loading]="isSaving()"
    />
  </ng-template>
</p-dialog>
